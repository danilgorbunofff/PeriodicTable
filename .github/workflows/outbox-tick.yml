name: outbox tick

# Free scheduler for the background workers (receipt/outbid email retry, preview
# generation, the abandoned-checkout sweep) and the alerting channel for money
# that contradicts itself (doc 08 R08-3): Vercel's free plan allows two crons,
# both daily and already taken by the mail/preview backstops, so a third cron
# cannot carry reconcile — this ten-minute tick is the only thing that polls it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Smoke test: enqueue preview rows for preview-less listings first"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: outbox-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://www.periodictable.lol
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # The recorded reading of the reconcile report's advisory `unverified.count`
      # (doc 13 R13-9). It was 0 on 2026-09-16 (run 35065018318, paidTotal 3), so
      # every unverified charge so far is accounted for by hand and anything above
      # this number is new: the step annotates the run with ::warning:: instead of
      # the old behaviour, where the only copy of that number was a log line nobody
      # read. Raise it in the same commit as the manual cross-check that accounts
      # for the new rows, and note the reading in doc/PROD-READINESS-CHECKLIST.md.
      # It is a warning and not a failure on purpose: an `unverified` row is PAID
      # and correct, so it is a coverage gap in this report, not money loss.
      RECONCILE_UNVERIFIED_BASELINE: "0"
    steps:
      - name: Fail loudly when CRON_SECRET is missing
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set (Settings → Secrets and variables → Actions) — every worker call would 401."
            exit 1
          fi

      - name: Verify the queue can actually move (manual only)
        if: inputs.backfill
        run: |
          # Enqueues PREVIEW_GENERATE rows for listings that have none, then
          # drains them — so a non-zero "updated" here proves the worker does
          # real work end to end, not merely that auth passed.
          curl -fsS -X POST "$BASE_URL/api/jobs/screenshot" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"backfill":true,"limit":10}'

      - name: Drain email outbox
        run: |
          # Re-loops while the route still reports `remaining > 0` (R13-5): a
          # backlog larger than one batch used to wait for the next ten-minute
          # tick, so a 300-row queue took over two hours to clear. Four calls is
          # the cap — 100 rows a tick, ~600 an hour — because the tick's own
          # timeout is five minutes and each call can hold the route's 24 s work
          # budget; a queue deeper than that still drains, just more slowly, and
          # every call prints its own counts.
          for i in 1 2 3 4; do
            body=$(curl -fsS -X POST "$BASE_URL/api/jobs/outbox" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"limit":25}') || exit 1
            echo "$body"
            # `remaining` is absent on a pre-R13-5 deployment and unreadable in a
            # truncated body; both mean "stop looping", not "fail the tick".
            remaining=$(printf '%s' "$body" | jq -r '.remaining // 0' 2>/dev/null || echo 0)
            case "$remaining" in ''|*[!0-9]*) remaining=0 ;; esac
            [ "$remaining" -gt 0 ] || break
          done

      - name: Generate due previews
        run: |
          # The same bounded re-loop, the same reason, a smaller batch (R13-5).
          for i in 1 2 3 4; do
            body=$(curl -fsS -X POST "$BASE_URL/api/jobs/screenshot" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"limit":10}') || exit 1
            echo "$body"
            remaining=$(printf '%s' "$body" | jq -r '.remaining // 0' 2>/dev/null || echo 0)
            case "$remaining" in ''|*[!0-9]*) remaining=0 ;; esac
            [ "$remaining" -gt 0 ] || break
          done

      - name: Abandon stale checkouts (never reached a provider)
        run: |
          # Closes the PENDING rows a buyer walked away from: older than
          # CHECKOUT_ABANDON_TTL_MS with no provider checkout URL and no provider
          # reference. Cannot hide the money check below — a payment that did
          # reach a provider always carries one of the two, so it is never
          # eligible here.
          curl -fsS -X POST "$BASE_URL/api/jobs/abandoned-checkouts" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"limit":50}'

      # --- Diagnostics: money FIRST, config second --------------------------
      # Reconcile runs ahead of the config check so a missing TURNSTILE_SECRET
      # cannot bury a money alarm in the log. Both carry `if: ${{ !cancelled() }}`:
      # by default a failed step skips every step after it, so without the guard
      # one 503 would keep the other from ever running — and during an incident
      # both must still report.
      #
      # GET /api/jobs/reconcile is the sole reader for money that contradicts
      # itself: a PAID row whose stored provider figure diverges, a captured
      # charge that never applied, or a reversal whose ERROR row landed after
      # payment. Those answer 503 AND are counted in the body, so this step
      # checks both. Its advisory findings (`unverified`, `stale`) answer 200 by
      # design — for the operator to read, not to page on.
      # GET /api/jobs/config answers 503 when a REQUIRED_PROD_ENV var is missing:
      # expect that step red until TURNSTILE_SECRET is set, which is correct.
      - name: Reconcile — money that contradicts itself
        if: ${{ !cancelled() }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/reconcile.json" -w '%{http_code}' \
            "$BASE_URL/api/jobs/reconcile" -H "Authorization: Bearer $CRON_SECRET")
          cat "$RUNNER_TEMP/reconcile.json"; echo
          # jq ships with ubuntu-latest; `|| echo ?` keeps a missing or
          # unparseable body from aborting before the findings are named.
          div=$(jq -r '.divergent.count // 0' "$RUNNER_TEMP/reconcile.json" 2>/dev/null || echo '?')
          un=$(jq -r '.unapplied.count // 0' "$RUNNER_TEMP/reconcile.json" 2>/dev/null || echo '?')
          if [ "$code" != "200" ] || [ "$div" != "0" ] || [ "$un" != "0" ]; then
            echo "::error::/api/jobs/reconcile HTTP $code — divergent=${div:-?} unapplied=${un:-?}. Real money: read the body above, settle a captured-but-unapplied charge by hand and correct any divergent PAID row (doc/review/08-settlement-and-ledger-integrity.md)."
            exit 1
          fi
          # The third failing block needs no check here: `aggregate` drift fails
          # `ok` and answers 503, so the arm above already pages on it (R12-2).
          #
          # Advisory findings answer 200 by design, which is why the one that
          # matters got no attention (R13-9): `unverified.count` was only ever
          # visible in this log. It is compared against its recorded baseline and
          # annotated — a warning, not a failure, and it keeps the previous
          # number in the run summary so a rise is visible without opening a log.
          unv=$(jq -r '.unverified.count // 0' "$RUNNER_TEMP/reconcile.json" 2>/dev/null || echo 0)
          case "$unv" in ''|*[!0-9]*) unv=0 ;; esac
          if [ "$unv" -gt "$RECONCILE_UNVERIFIED_BASELINE" ]; then
            echo "::warning::/api/jobs/reconcile unverified=${unv}, above the recorded baseline ${RECONCILE_UNVERIFIED_BASELINE}. A captured payment that no longer cross-checks to a provider figure: the row is PAID and correct, the report's coverage is what shrank. Read the samples in the body above, cross-check them against the provider dashboard by hand, and raise RECONCILE_UNVERIFIED_BASELINE in .github/workflows/outbox-tick.yml in the same commit as the note that accounts for them."
          else
            echo "unverified=${unv} (baseline ${RECONCILE_UNVERIFIED_BASELINE})"
          fi
      - name: Config gaps — a required prod secret is missing
        if: ${{ !cancelled() }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/config.json" -w '%{http_code}' \
            "$BASE_URL/api/jobs/config" -H "Authorization: Bearer $CRON_SECRET")
          cat "$RUNNER_TEMP/config.json"; echo
          if [ "$code" != "200" ]; then
            echo "::error::/api/jobs/config answered $code — read the findings above: a 'required' entry is missing."
            exit 1
          fi
